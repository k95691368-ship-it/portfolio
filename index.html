<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111110" />
    <link rel="preconnect" href="https://obumqkwkvnemkyaahjbn.supabase.co" crossorigin />
    <title>AI 채용 · 전자근로계약 플랫폼</title>

    <!--
      리액트가 뜨기 전에 먼저 그린다.

      재 보니 코드는 128ms 에 다 도착하는데 첫 글자가 뜨는 것은 284ms 였다.
      그 사이 156ms 동안 화면은 완전히 비어 있다 -- #root 가 빈 칸이라 브라우저가
      그릴 것이 없기 때문이다. 서버도 파일도 빠른데 방문자는 흰 화면을 본다.

      아래 두 줄은 HTML 만으로 바로 그려진다. 리액트가 뜨면 #root 안이 통째로
      바뀌므로 따로 지울 필요가 없다.

      서비스는 검은 화면만 사용한다. HTML 단계에서부터 색을 고정해 리액트가
      뜨기 전 흰 화면이 잠깐 보이는 일도 막는다.
    -->
    <style>
      /* 본 스타일시트가 오기 전에도 맞는 색으로 그린다. */
      :root {
        color-scheme: dark;
        --boot-bg: #111110;
        --boot-heading: #f0f0ee;
        --boot-muted: #a0a098;
      }
      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: var(--boot-bg);
      }
      .boot {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-family: Aptos, 'Segoe UI', 'SUIT Variable', system-ui, sans-serif;
        color: var(--boot-muted);
        font-weight: 400;
        letter-spacing: 0;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .boot-title {
        color: var(--boot-heading);
        font-size: 17px;
        font-weight: 600;
        line-height: 1.58824;
      }
      .boot-sub {
        font-size: 14px;
        line-height: 1.42857;
      }
    </style>

    <!-- External analytics disabled: sensitive SPA routes must never be recorded. -->
  </head>
  <body>
    <div id="root">
      <!-- 리액트가 뜨면 이 안이 통째로 바뀐다. -->
      <div class="boot">
        <span class="boot-title">AI 채용 · 전자근로계약 플랫폼</span>
        <span class="boot-sub">불러오는 중...</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
