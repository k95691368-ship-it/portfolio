<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 채용 · 전자근로계약 플랫폼</title>

    <!--
      리액트가 뜨기 전에 먼저 그린다.

      재 보니 코드는 128ms 에 다 도착하는데 첫 글자가 뜨는 것은 284ms 였다.
      그 사이 156ms 동안 화면은 완전히 비어 있다 -- #root 가 빈 칸이라 브라우저가
      그릴 것이 없기 때문이다. 서버도 파일도 빠른데 방문자는 흰 화면을 본다.

      아래 두 줄은 HTML 만으로 바로 그려진다. 리액트가 뜨면 #root 안이 통째로
      바뀌므로 따로 지울 필요가 없다.

      고른 화면 색을 먼저 입힌다. 이 스크립트가 없으면 저장해 둔 어두운 화면이
      리액트가 뜬 뒤에야 적용돼, 어두운 화면을 쓰는 사람은 매번 흰 화면이
      번쩍인 뒤 어두워진다.
    -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          /* 저장소를 못 쓰는 브라우저에서도 화면은 떠야 한다 */
        }
      })()
    </script>
    <style>
      /* 본 스타일시트가 오기 전에도 맞는 색으로 그린다. */
      :root {
        --boot-bg: #fff;
        --boot-text: #6b7684;
      }
      html[data-theme='dark'] {
        --boot-bg: #17171c;
        --boot-text: #98a2ad;
      }
      html,
      body {
        margin: 0;
        background: var(--boot-bg);
      }
      .boot {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          'SF Pro Display',
          'Helvetica Neue',
          'Apple SD Gothic Neo',
          'Noto Sans KR',
          'Malgun Gothic',
          'Segoe UI',
          Arial,
          sans-serif;
        color: var(--boot-text);
      }
      .boot-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .boot-sub {
        font-size: 13px;
      }
    </style>

    <!-- Google tag (gtag.js) -->
    <!--
      이 사이트의 주소에는 사람을 여는 열쇠가 들어 있다. 면접방 id, 지원서 id,
      증명서 발급번호, 그리고 지원 현황 접수번호다. 접수번호 하나면 남의 지원
      내역이 열리고 발급번호 하나면 근로계약 증명서가 열린다. 애널리틱스
      보고서는 주소를 목록으로 그대로 보여 주므로, 손대지 않으면 그 열쇠들이
      구글 계정 화면에 줄줄이 쌓인다.

      send_page_view 를 끄는 것만으로는 모자란다 -- 실제로 확인해 보니 uuid 가
      그대로 나갔다. 그것이 막는 것은 page_view 하나뿐이고, GA4 가 스스로 보내는
      나머지 이벤트(세션 시작, 스크롤, 참여 시간 등)는 보낼 때마다 주소 표시줄을
      다시 읽어 싣는다.

      그래서 태그를 켜기 전에 주소를 먼저 덮어쓴다. 여기서 한 번 덮어 두면
      이후 모든 신호가 이 값을 쓴다.

      아래 가리기는 '무엇이든 id 처럼 생겼으면 가린다'는 안전망이다. 화면마다
      붙는 정확한 이름표(/rooms/:roomId 같은)는 src/lib/analytics.js 가 화면을
      옮길 때마다 다시 덮어쓴다. 둘이 어긋나도 이쪽이 더 많이 가리는 쪽이라
      새지 않는다.
    -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      ;(function () {
        var safe =
          location.pathname
            .split('/')
            .map(function (seg) {
              // uuid 또는 숫자로만 된 토막은 id 로 본다.
              return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(seg) ||
                /^\d+$/.test(seg)
                ? ':id'
                : seg
            })
            .join('/') || '/'
        // 물음표 뒤(접수번호·발급번호)는 통째로 버린다.
        gtag('set', {
          page_location: location.origin + safe,
          page_path: safe,
          page_title: document.title,
        })
      })()
      gtag('js', new Date())
      gtag('config', 'G-YLPE56VFG1', { send_page_view: false })
    </script>

    <!-- Microsoft Clarity -->
    <!--
      클래리티는 화면을 그대로 녹화한다. 애널리틱스와는 무게가 다르다.
      애널리틱스는 "어느 화면을 봤는가"를 세지만, 클래리티는 그 화면에 무엇이
      적혀 있었는지를 통째로 저장한다.

      이 사이트의 화면에는 지원자 이름·연락처, 오간 대화, 근로계약서 조건,
      서명 이미지가 뜬다. 클래리티의 기본 설정(Balanced)은 숫자와 이메일만
      가리므로, 이름과 대화와 계약 문구는 그대로 마이크로소프트로 넘어간다.

      그래서 개인정보가 뜨는 화면은 src/App.jsx 에서 data-clarity-mask 로
      통째로 가린다. 그 표시는 문서 설정보다 우선한다.

      막지 못한 것 하나: 주소는 가릴 방법이 없다. 클래리티에는 녹화를 멈추거나
      주소를 바꿔 보내는 API 가 없다(consent/identify/set/event/upgrade 뿐).
      지원 현황과 증명서 확인은 ?code= ?serial= 로 조회값을 받으므로, 그 주소로
      들어온 방문은 조회값이 녹화에 남는다. 클래리티 설정에서 마스킹 모드를
      Strict 로 올려 두는 것을 함께 권한다.
    -->
    <script type="text/javascript">
      window.clarity =
        window.clarity ||
        function () {
          ;(window.clarity.q = window.clarity.q || []).push(arguments)
        }
    </script>

    <!--
      분석 도구 두 개를 화면이 다 뜬 뒤에 불러온다.

      재 보니 이 둘이 첫 화면 292KB 중 195KB 였다. 우리 코드 전부(96KB)의 두
      배다. async 를 붙여도 다운로드는 첫 화면 그리기와 같은 회선을 나눠 쓰므로,
      느린 연결에서는 방문자가 그만큼 더 빈 화면을 본다. 방문 통계를 보자고
      방문자를 기다리게 하는 셈이다.

      늦게 불러도 기록은 잃지 않는다. 두 도구 모두 스크립트가 뜨기 전의 호출을
      큐에 쌓아 두었다가(dataLayer 와 clarity.q) 뜨는 순간 한꺼번에 처리한다.
      위에서 큐만 먼저 만들어 둔 이유가 이것이다.

      load 뒤 한가한 틈을 노리되, 계속 바쁜 화면에서 영영 안 불러오는 일이
      없도록 2초 뒤에는 그냥 부른다. requestIdleCallback 이 없는 브라우저
      (사파리 일부)도 setTimeout 으로 떨어진다.
    -->
    <script>
      ;(function () {
        function load() {
          // 화상 면접에서는 화면 마스킹만으로 충분하지 않다. 장치 상태와 참가자
          // 영상이 생기기 전에 분석 스크립트 자체를 싣지 않는다. 면접방에서 이
          // 주소로 올 때는 전체 문서 이동을 사용하므로 이미 로드된 Clarity도
          // 함께 종료된다.
          if (/^\/rooms\/[^/]+\/interview\/[^/]+\/?$/.test(location.pathname)) return
          var srcs = [
            'https://www.googletagmanager.com/gtag/js?id=G-YLPE56VFG1',
            'https://www.clarity.ms/tag/y288l28thj',
          ]
          for (var i = 0; i < srcs.length; i++) {
            var s = document.createElement('script')
            s.async = true
            s.src = srcs[i]
            document.head.appendChild(s)
          }
        }
        function schedule() {
          if (window.requestIdleCallback) window.requestIdleCallback(load, { timeout: 2000 })
          else setTimeout(load, 1200)
        }
        // 이미 다 떴으면 기다릴 것이 없다.
        if (document.readyState === 'complete') schedule()
        else addEventListener('load', schedule, { once: true })
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- 리액트가 뜨면 이 안이 통째로 바뀐다. -->
      <div class="boot">
        <span class="boot-title">AI 채용 · 전자근로계약 플랫폼</span>
        <span class="boot-sub">불러오는 중...</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
