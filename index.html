<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 채용 · 전자근로계약 플랫폼</title>

    <!-- Google tag (gtag.js) -->
    <!--
      이 사이트의 주소에는 사람을 여는 열쇠가 들어 있다. 면접방 id, 지원서 id,
      증명서 발급번호, 그리고 지원 현황 접수번호다. 접수번호 하나면 남의 지원
      내역이 열리고 발급번호 하나면 근로계약 증명서가 열린다. 애널리틱스
      보고서는 주소를 목록으로 그대로 보여 주므로, 손대지 않으면 그 열쇠들이
      구글 계정 화면에 줄줄이 쌓인다.

      send_page_view 를 끄는 것만으로는 모자란다 -- 실제로 확인해 보니 uuid 가
      그대로 나갔다. 그것이 막는 것은 page_view 하나뿐이고, GA4 가 스스로 보내는
      나머지 이벤트(세션 시작, 스크롤, 참여 시간 등)는 보낼 때마다 주소 표시줄을
      다시 읽어 싣는다.

      그래서 태그를 켜기 전에 주소를 먼저 덮어쓴다. 여기서 한 번 덮어 두면
      이후 모든 신호가 이 값을 쓴다.

      아래 가리기는 '무엇이든 id 처럼 생겼으면 가린다'는 안전망이다. 화면마다
      붙는 정확한 이름표(/rooms/:roomId 같은)는 src/lib/analytics.js 가 화면을
      옮길 때마다 다시 덮어쓴다. 둘이 어긋나도 이쪽이 더 많이 가리는 쪽이라
      새지 않는다.
    -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      ;(function () {
        var safe =
          location.pathname
            .split('/')
            .map(function (seg) {
              // uuid 또는 숫자로만 된 토막은 id 로 본다.
              return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(seg) ||
                /^\d+$/.test(seg)
                ? ':id'
                : seg
            })
            .join('/') || '/'
        // 물음표 뒤(접수번호·발급번호)는 통째로 버린다.
        gtag('set', {
          page_location: location.origin + safe,
          page_path: safe,
          page_title: document.title,
        })
      })()
      gtag('js', new Date())
      gtag('config', 'G-YLPE56VFG1', { send_page_view: false })
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YLPE56VFG1"></script>

    <!-- Microsoft Clarity -->
    <!--
      클래리티는 화면을 그대로 녹화한다. 애널리틱스와는 무게가 다르다.
      애널리틱스는 "어느 화면을 봤는가"를 세지만, 클래리티는 그 화면에 무엇이
      적혀 있었는지를 통째로 저장한다.

      이 사이트의 화면에는 지원자 이름·연락처, 오간 대화, 근로계약서 조건,
      서명 이미지가 뜬다. 클래리티의 기본 설정(Balanced)은 숫자와 이메일만
      가리므로, 이름과 대화와 계약 문구는 그대로 마이크로소프트로 넘어간다.

      그래서 개인정보가 뜨는 화면은 src/App.jsx 에서 data-clarity-mask 로
      통째로 가린다. 그 표시는 문서 설정보다 우선한다.

      막지 못한 것 하나: 주소는 가릴 방법이 없다. 클래리티에는 녹화를 멈추거나
      주소를 바꿔 보내는 API 가 없다(consent/identify/set/event/upgrade 뿐).
      지원 현황과 증명서 확인은 ?code= ?serial= 로 조회값을 받으므로, 그 주소로
      들어온 방문은 조회값이 녹화에 남는다. 클래리티 설정에서 마스킹 모드를
      Strict 로 올려 두는 것을 함께 권한다.
    -->
    <script type="text/javascript">
      ;(function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            ;(c[a].q = c[a].q || []).push(arguments)
          }
        t = l.createElement(r)
        t.async = 1
        t.src = 'https://www.clarity.ms/tag/' + i
        y = l.getElementsByTagName(r)[0]
        y.parentNode.insertBefore(t, y)
      })(window, document, 'clarity', 'script', 'y288l28thj')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
