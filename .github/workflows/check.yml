# 린트·타입 검사·시험·빌드를 여기서 돌린다.
#
# 이 저장소를 만드는 컴퓨터는 Windows 11 Home이고 스마트 앱 컨트롤이 켜져
# 있다. 그게 서명 없는 실행 파일을 막는데 oxlint의 네이티브 바이너리가
# 서명이 없어서 걸린다(CodeIntegrity 이벤트 3077/3033). 예외 목록이 없고,
# 끄면 Windows를 다시 깔기 전에는 못 켠다. 되돌릴 수 없는 시스템 설정을
# 린트 하나 때문에 끄는 것은 값이 안 맞는다.
#
# 그래서 리눅스에서 돌린다. 부수 효과로 검사가 기록에 남는다.

name: 검사

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        id: install
        run: npm ci

      # 설치가 성공하면 앞 검사의 실패와 관계없이 네 검사를 모두 실행한다.
      # 실패한 단계의 결과는 그대로 남아 전체 작업도 실패한다.
      - name: 린트
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: 타입 검사
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: 시험
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: 빌드
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
